name: CityHQ quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/venv && backend/venv/bin/pip install -r backend/requirements.txt
      - run: venv/bin/ruff check app tests migrations && venv/bin/ruff format --check app tests migrations && venv/bin/pytest -q
        working-directory: backend
      - run: venv/bin/alembic upgrade head && venv/bin/python -m app.ml.pipeline --mode synthetic
        working-directory: backend
      - run: npm ci && npm run lint && npm run typecheck && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
